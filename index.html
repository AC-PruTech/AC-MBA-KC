*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Verdana,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0d2836 0%,#173948 100%);padding:20px}
.card{background:#fff;border-radius:12px;max-width:400px;width:100%;padding:36px 32px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
.emoji{font-size:44px}
h1{font-family:Georgia,serif;font-weight:normal;color:#102e3c;font-size:26px;margin:14px 0 6px}
p.sub{color:#4b5d65;font-size:14px;line-height:1.5;margin-bottom:22px}
label{display:block;text-align:left;font-size:12px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;color:#344f59;margin-bottom:6px}
input{width:100%;padding:13px 14px;font-size:17px;border:1px solid #d8dfdf;border-radius:6px;background:#faf9f5;color:#182c36;letter-spacing:2px;text-align:center}
input:focus{outline:3px solid #f2c66c;outline-offset:1px;border-color:#80541b}
button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:6px;background:#f2c66c;color:#203039;font-size:15px;font-weight:bold;cursor:pointer}
button:hover{background:#e8b84f}
.error{display:none;margin-top:14px;background:#fdecec;color:#9a1c1c;border:1px solid #f5b8b8;padding:10px 12px;border-radius:6px;font-size:13px}
.hint{margin-top:18px;font-size:11px;color:#8a979d}
</style>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function gunzip(bytes){
 const ds=new DecompressionStream('gzip');
 const stream=new Blob([bytes]).stream().pipeThrough(ds);
 return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function unlock(pw){
 const keyMat=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(PAYLOAD.salt),iterations:210000,hash:'SHA-256'},keyMat,{name:'AES-GCM',length:256},false,['decrypt']);
 const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.iv)},key,b64(PAYLOAD.data));
 return new TextDecoder().decode(await gunzip(new Uint8Array(plain)));
}
function showErr(){const e=document.getElementById('err');e.style.display='block';document.getElementById('pw').value='';document.getElementById('pw').focus();}
document.getElementById('f').addEventListener('submit',async ev=>{
 ev.preventDefault();
 const pw=document.getElementById('pw').value;
 if(!pw)return showErr();
 try{
  const html=await unlock(pw);
  try{sessionStorage.setItem('kcw-pw',pw)}catch(e){}
  document.open();document.write(html);document.close();
 }catch(e){showErr()}
});
(async()=>{try{const s=sessionStorage.getItem('kcw-pw');if(s){try{const html=await unlock(s);document.open();document.write(html);document.close();}catch(e){sessionStorage.removeItem('kcw-pw')}}}catch(e){}})();
