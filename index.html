<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Anthony Cala, MBA 2026 Kansas City Commencement Weekend</title><script src="celebration.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#102e3c;font-family:Verdana,sans-serif;padding:24px}.card{background:#fffdf7;max-width:450px;padding:42px 32px;text-align:center;border-radius:10px;border-top:5px solid #d6b375;box-shadow:0 20px 60px #0004}h1{font:34px Georgia,serif;color:#102e3c;margin:12px 0}h2{font:23px Georgia,serif;color:#8b693e}p{font-size:14px;line-height:1.6;color:#49616b}label{display:block;font-size:12px;font-weight:bold;text-align:left;margin:24px 0 8px}input{width:100%;padding:14px;border:1px solid #c5c5b8;border-radius:5px;font-size:18px}button{width:100%;padding:15px;margin-top:16px;background:#d6b375;border:0;border-radius:5px;color:#102e3c;font-size:15px;font-weight:bold;cursor:pointer}#err{display:none;color:#a62626}small{letter-spacing:2px;color:#8b693e}</style></head><body><div class="card"><small>CLASS OF 2026</small><h1>Anthony Cala, MBA 2026</h1><h2>Kansas City Commencement Weekend</h2><p>November 5-8, 2026<br>A milestone worth celebrating, together.</p><form id="f"><label for="pw">Family password</label><input id="pw" type="password" required><button>Unlock the celebration</button><p id="err">Unable to unlock. Check the password and try again.</p></form></div><script>const SALT='QHw0D5fRcVBOfgLtrfNo/g==',IV='qwvF4wruCGi1Q02K';const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));async function unlock(pw){const parts=await Promise.all([1,2,3,4,5,6].map(i=>fetch('p'+i+'.txt').then(r=>{if(!r.ok)throw Error();return r.text()})));const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:210000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(parts.join('')));let html=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();html=html.replaceAll('Anthony Marcos Cala &amp; Jennifer Cala','Anthony &amp; Jennifer').replaceAll('Anthony Marcos Cala & Jennifer Cala','Anthony & Jennifer').replaceAll('Jen, Anthony, Connor, Dad &amp; Jill','Anthony, Jen, Connor, Dad &amp; Jill').replaceAll('Jen, Anthony, Connor, Dad & Jill','Anthony, Jen, Connor, Dad & Jill').replaceAll('First call listed on flyer: 12:30 PM','').replaceAll('Must-Try: Famous Brisket <strong>Z-Man</strong>, Burnt Ends, Ribs, &amp; Vegetarian <strong>Portobello Z-Man</strong> • ','').replaceAll('Dad (Chris)','Dad');html=await enhance(html);html=html.replace('</head>','<style>.hero-grid{grid-template-columns:1fr!important}.hero-editorial{grid-template-columns:1.3fr 1fr!important;max-width:940px;gap:64px!important}.hero-editorial h1{font-size:clamp(52px,6vw,84px)!important}.weekend-title{color:#e4c594!important}.hero-editorial h1 em,.hero .eyebrow,.edition{color:#dfbb7f!important}.portrait img{object-fit:contain!important;height:auto!important;width:100%!important}.hero-card{max-width:940px;margin-top:30px}.hero-editorial+*{margin-top:20px}@media(max-width:600px){.hero-editorial{grid-template-columns:1fr!important;gap:15px!important}.hero-editorial h1{font-size:54px!important}.portrait{width:260px!important}.hero-card{margin-top:20px}}</style></head>');return html}function show(html){document.open();document.write(html);document.close()}document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const pw=document.getElementById('pw').value;try{const html=await unlock(pw);sessionStorage.setItem('kcw-pw',pw);show(html)}catch(e){document.getElementById('err').style.display='block'}});(async()=>{const pw=sessionStorage.getItem('kcw-pw');if(pw)try{show(await unlock(pw))}catch(e){sessionStorage.removeItem('kcw-pw')}})();</script></body></html>
