const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function gunzip(bytes){
 const ds=new DecompressionStream('gzip');
 const stream=new Blob([bytes]).stream().pipeThrough(ds);
 return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function unlock(pw){
 const keyMat=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(PAYLOAD.salt),iterations:210000,hash:'SHA-256'},keyMat,{name:'AES-GCM',length:256},false,['decrypt']);
 const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.iv)},key,b64(PAYLOAD.data));
 return new TextDecoder().decode(await gunzip(new Uint8Array(plain)));
}
function showErr(){const e=document.getElementById('err');e.style.display='block';document.getElementById('pw').value='';document.getElementById('pw').focus();}
document.getElementById('f').addEventListener('submit',async ev=>{
 ev.preventDefault();
 const pw=document.getElementById('pw').value;
 if(!pw)return showErr();
 try{
  const html=await unlock(pw);
  try{sessionStorage.setItem('kcw-pw',pw)}catch(e){}
  document.open();document.write(html);document.close();
 }catch(e){showErr()}
});
(async()=>{try{const s=sessionStorage.getItem('kcw-pw');if(s){try{const html=await unlock(s);document.open();document.write(html);document.close();}catch(e){sessionStorage.removeItem('kcw-pw')}}}catch(e){}})();
</script>
